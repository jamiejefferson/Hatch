<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flights | Acme</title>
<style>
  body { font: 16px/24px system-ui, sans-serif; margin: 40px; }
  form { position: relative; display: flex; flex-direction: column; gap: 12px; width: 320px; }
  input { font: inherit; padding: 8px 12px; }
  /* The list opens over the next field, the way a travel site's suggestions do. */
  ul { position: absolute; left: 0; width: 320px; margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid #999; z-index: 5; }
  li { padding: 12px; min-height: 40px; cursor: pointer; }
</style>
</head>
<body>
<h1>Find a flight</h1>
<form onsubmit="return false">
  <input id="from" role="combobox" aria-label="Where from?" aria-expanded="false" aria-controls="list" autocomplete="off">
  <input id="to" role="combobox" aria-label="Where to?" aria-expanded="false" aria-controls="list" autocomplete="off">
  <input id="return" aria-label="Return" autocomplete="off">
  <button type="button" id="dates">Dates</button>
  <button type="button" id="search">Search</button>
  <ul id="list" role="listbox" aria-label="Suggestions" hidden></ul>
</form>
<!-- The real date field lives in a dialog that opens over the page's own, as a travel site's date picker does. -->
<div id="picker" role="dialog" aria-label="Choose dates" hidden style="position:absolute; left:20px; top:60px; width:420px; height:320px; padding:20px; background:#fff; border:1px solid #999; z-index:9">
  <input id="return-real" aria-label="Return" autocomplete="off">
</div>
<p id="result" aria-live="polite"></p>
<script>
  const PLACES = ['Edinburgh, United Kingdom', 'Edinburgh Airport', 'Milan, Italy', 'Milan Malpensa Airport'];
  const list = document.getElementById('list');
  for (const field of document.querySelectorAll('input')) {
    field.addEventListener('input', () => {
      // Suggestions come from a server on a real site, so they arrive a moment after the typing.
      setTimeout(() => {
        const found = PLACES.filter((p) => p.toLowerCase().startsWith(field.value.toLowerCase()) && field.value);
        list.innerHTML = '';
        for (const place of found) {
          const li = document.createElement('li');
          li.role = 'option';
          li.textContent = place;
          li.addEventListener('click', () => {
            field.value = place;
            field.setAttribute('aria-expanded', 'false');
            list.hidden = true;
          });
          list.append(li);
        }
        list.style.top = `${field.offsetTop + field.offsetHeight}px`;
        list.hidden = found.length === 0;
        field.setAttribute('aria-expanded', String(found.length > 0));
      }, 400);
    });
  }
  document.getElementById('dates').addEventListener('click', () => (document.getElementById('picker').hidden = false));
  document.getElementById('search').addEventListener('click', () => {
    document.getElementById('result').textContent = `Showing flights from ${document.getElementById('from').value} to ${document.getElementById('to').value}.`;
  });
</script>
</body>
</html>
