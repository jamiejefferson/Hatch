<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sign in | Acme</title>
<style>
  body { font: 16px/24px system-ui, sans-serif; margin: 48px; color: #111; }
  form { display: grid; gap: 12px; width: 320px; }
  input, button { font: inherit; padding: 8px 12px; }
  .quiet { color: #999; background: #fff; }
</style>
<h1>Sign in</h1>
<p class="quiet" id="quiet">Low contrast helper text</p>
<form id="login" action="account.html" method="post">
  <input type="search" name="q" placeholder="Search the help pages" hidden>
  <input type="email" name="email" placeholder="Email" autocomplete="username">
  <input type="password" name="password" placeholder="Password" autocomplete="current-password">
  <button>Sign in</button>
</form>
<script>
  document.getElementById('login').addEventListener('submit', (e) => {
    const data = new FormData(e.target);
    sessionStorage.setItem('signed-in', data.get('email') + ':' + String(data.get('password')).length);
  });
</script>
